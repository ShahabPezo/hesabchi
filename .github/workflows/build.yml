name: Build Hesabchi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test || true

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        env:
          HESABCHI_GITHUB_READER_TOKEN: ${{ secrets.HESABCHI_GITHUB_READER_TOKEN }}
        run: |
          flutter build apk --debug \
            --dart-define=HESABCHI_GITHUB_READER_TOKEN="$HESABCHI_GITHUB_READER_TOKEN"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesabchi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
